name: Cloudflare Ops
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  get-wrangler-version:
    runs-on: ubuntu-latest
    outputs:
      wrangler: ${{ steps.get-version.outputs.wrangler }}
    steps:
      - id: get-version
        run: |
          VERSION=$(curl -s "https://registry.npmjs.org/wrangler/latest" | jq -r '.version')
          echo "🔎 wrangler=$VERSION"
          echo "wrangler=$VERSION" >> $GITHUB_OUTPUT

  build-and-publish:
    needs: get-wrangler-version
    runs-on: ubuntu-latest
    steps:
      - name: Github Environment Variables
        run: |
          echo "🔎 github.repository=${{github.repository}}"
          echo "🔎 github.sha=${{github.sha}}"
          echo "🔎 github.event.repository.name=${{github.event.repository.name}}"
          echo "🔎 github.ref_name=${{github.ref_name}}"
          echo "🔎 wrangler=${{needs.get-wrangler-version.outputs.wrangler}}"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESSTOKEN_RW }}

      # Load the image locally first and smoke test it, so a broken image never
      # reaches the registry. Guards the class of bug where the container starts
      # fine but every real command fails (unwritable cwd, missing binary, ...).
      - name: Build Docker image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          build-args: |
            WRANGLER_VERSION=${{needs.get-wrangler-version.outputs.wrangler}}
          tags: cloudflare-ops:ci

      - name: Smoke test
        run: |
          set -euo pipefail
          echo "--- help ---"
          docker run --rm cloudflare-ops:ci help
          echo "--- wrangler version ---"
          docker run --rm cloudflare-ops:ci version
          # wrangler writes its cache to ./.wrangler/cache, so an unwritable cwd
          # breaks every real command. Asserted directly: the failure only shows
          # up with valid credentials, far too late to catch it any other way.
          echo "--- working directory is writable ---"
          docker run --rm --entrypoint sh cloudflare-ops:ci -c 'touch ./.wrangler-probe'

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            WRANGLER_VERSION=${{needs.get-wrangler-version.outputs.wrangler}}
          tags: |
            baunach/${{github.event.repository.name}}:${{needs.get-wrangler-version.outputs.wrangler}}
            baunach/${{github.event.repository.name}}:latest
